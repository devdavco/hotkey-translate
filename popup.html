<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
      --accent: #1a73e8;
      --box: #f1f3f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #5f6368;
        --accent: #8ab4f8;
        --box: #303134;
      }
    }
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      color: var(--accent);
    }
    label {
      display: block;
      margin: 12px 0 4px;
      font-weight: bold;
    }
    select {
      width: 100%;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    #swapBtn {
      display: block;
      margin: 8px auto 0;
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    #swapBtn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #status {
      height: 16px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .info {
      margin-top: 8px;
      padding: 10px;
      background: var(--box);
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
    }
    .info ul {
      margin: 6px 0;
      padding-left: 18px;
    }
    .shortcut {
      font-family: monospace;
    }
    .note {
      color: var(--muted);
    }
    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <h1 data-i18n="extName">Hotkey Translate</h1>

  <label for="sourceLang" data-i18n="sourceLabel">Source language:</label>
  <select id="sourceLang">
    <option value="auto" data-i18n="langAuto">Detect automatically</option>
    <option value="en" data-i18n="langEn">English</option>
    <option value="es" data-i18n="langEs">Spanish</option>
    <option value="fr" data-i18n="langFr">French</option>
    <option value="de" data-i18n="langDe">German</option>
    <option value="it" data-i18n="langIt">Italian</option>
    <option value="pt" data-i18n="langPt">Portuguese</option>
    <option value="ru" data-i18n="langRu">Russian</option>
    <option value="ja" data-i18n="langJa">Japanese</option>
    <option value="zh-CN" data-i18n="langZhCN">Chinese (Simplified)</option>
  </select>

  <button id="swapBtn" data-i18n-title="swapTitle" title="Swap languages">&#8645;</button>

  <label for="targetLang" data-i18n="targetLabel">Target language:</label>
  <select id="targetLang">
    <option value="en" data-i18n="langEn">English</option>
    <option value="es" data-i18n="langEs">Spanish</option>
    <option value="fr" data-i18n="langFr">French</option>
    <option value="de" data-i18n="langDe">German</option>
    <option value="it" data-i18n="langIt">Italian</option>
    <option value="pt" data-i18n="langPt">Portuguese</option>
    <option value="ru" data-i18n="langRu">Russian</option>
    <option value="ja" data-i18n="langJa">Japanese</option>
    <option value="zh-CN" data-i18n="langZhCN">Chinese (Simplified)</option>
  </select>

  <label for="ttsLang" data-i18n="ttsLabel">Audio language:</label>
  <select id="ttsLang">
    <option value="en-US" data-i18n="langEnUS">English (US)</option>
    <option value="en-GB" data-i18n="langEnGB">English (UK)</option>
    <option value="es-ES" data-i18n="langEs">Spanish</option>
    <option value="fr-FR" data-i18n="langFr">French</option>
    <option value="de-DE" data-i18n="langDe">German</option>
    <option value="it-IT" data-i18n="langIt">Italian</option>
    <option value="pt-BR" data-i18n="langPtBR">Portuguese (Brazil)</option>
    <option value="ru-RU" data-i18n="langRu">Russian</option>
    <option value="ja-JP" data-i18n="langJa">Japanese</option>
    <option value="zh-CN" data-i18n="langZhCN">Chinese (Simplified)</option>
  </select>

  <div id="status"></div>

  <div class="info">
    <strong data-i18n="shortcutsTitle">Keyboard shortcuts:</strong>
    <ul id="shortcuts"></ul>
    <div class="note" data-i18n="shortcutsNote">Defaults: Ctrl+Shift+1 and Ctrl+Shift+2 (Command on Mac). You can change them.</div>
    <a href="#" id="shortcutsLink" data-i18n="changeShortcuts">Change shortcuts</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
