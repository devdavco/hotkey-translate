<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
      --accent: #1a73e8;
      --box: #f1f3f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #5f6368;
        --accent: #8ab4f8;
        --box: #303134;
      }
    }
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      color: var(--accent);
    }
    label {
      display: block;
      margin: 12px 0 4px;
      font-weight: bold;
    }
    select {
      width: 100%;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    #swapBtn {
      display: block;
      margin: 8px auto 0;
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    #swapBtn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #status {
      height: 16px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .info {
      margin-top: 8px;
      padding: 10px;
      background: var(--box);
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
    }
    .info ul {
      margin: 6px 0;
      padding-left: 18px;
    }
    .shortcut {
      font-family: monospace;
    }
    .note {
      color: var(--muted);
    }
    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <h1>Simple Translate</h1>

  <label for="sourceLang">Idioma origen:</label>
  <select id="sourceLang">
    <option value="auto">Detectar automáticamente</option>
    <option value="en">Inglés</option>
    <option value="es">Español</option>
    <option value="fr">Francés</option>
    <option value="de">Alemán</option>
    <option value="it">Italiano</option>
    <option value="pt">Portugués</option>
    <option value="ru">Ruso</option>
    <option value="ja">Japonés</option>
    <option value="zh-CN">Chino (Simplificado)</option>
  </select>

  <button id="swapBtn" title="Intercambiar idiomas">&#8645;</button>

  <label for="targetLang">Idioma destino:</label>
  <select id="targetLang">
    <option value="en">Inglés</option>
    <option value="es">Español</option>
    <option value="fr">Francés</option>
    <option value="de">Alemán</option>
    <option value="it">Italiano</option>
    <option value="pt">Portugués</option>
    <option value="ru">Ruso</option>
    <option value="ja">Japonés</option>
    <option value="zh-CN">Chino (Simplificado)</option>
  </select>

  <label for="ttsLang">Idioma de audio:</label>
  <select id="ttsLang">
    <option value="en-US">Inglés (US)</option>
    <option value="en-GB">Inglés (UK)</option>
    <option value="es-ES">Español</option>
    <option value="fr-FR">Francés</option>
    <option value="de-DE">Alemán</option>
    <option value="it-IT">Italiano</option>
    <option value="pt-BR">Portugués (Brasil)</option>
    <option value="ru-RU">Ruso</option>
    <option value="ja-JP">Japonés</option>
    <option value="zh-CN">Chino (Simplificado)</option>
  </select>

  <div id="status"></div>

  <div class="info">
    <strong>Atajos de teclado:</strong>
    <ul id="shortcuts"></ul>
    <div class="note">Atajos por defecto: Ctrl+Shift+1 y Ctrl+Shift+2 (Command en Mac). Puedes cambiarlos.</div>
    <a href="#" id="shortcutsLink">Cambiar atajos</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
